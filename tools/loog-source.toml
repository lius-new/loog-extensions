# The one Loog commit this repository builds against. Every workflow reads it:
# the Rust language clients take their WIT from it, the AOT verification builds its
# host from it, and until tools/validator.lock names a published validator the
# production validator is built from it. When Loog changes its extension interface,
# move this commit forward in the same change that adapts the extensions.
# Development PRs may pin a full commit from their paired Loog PR. Publication
# verifies that this exact commit is on Loog's main branch. After a squash merge,
# repin to the resulting main commit and rerun validation before publishing.
