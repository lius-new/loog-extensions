schema = 1
kind = "language"

[extension]
name = "Zig"
version = "1.0.0"
description = "Syntax highlighting for Zig."

[sources.helix]
repository = "https://github.com/helix-editor/helix"
revision = "ba40e547426b0f9896c8bdc699a4ab11f2b37dbc"
sha256 = "c5e35c68897a0f3793937095d8d9c13340fa18e727a3696ae16fa0edd1d08d23"
licenses = [ "LICENSE" ]

[sources.zig]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-zig"
revision = "6479aa13f32f701c383083d8b28360ebd682fb7d"
sha256 = "34b338658c7548ea7e723b9a74a18bba76d16bf453bc4a9deb13f2f507f4e725"
licenses = [ "LICENSE" ]

[grammars.zig]
source = "zig"
path = "."
file-types = [ "zig" ]
sample = "samples/zig.txt"
injections = []

[[grammars.zig.highlights]]
source = "helix"
path = "runtime/queries/zig/highlights.scm"

[grammars.zig.capture-map]
character = "string"
boolean = "constant.builtin.boolean"
spell = "_spell"
