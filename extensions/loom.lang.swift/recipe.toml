schema = 1
kind = "language"

[extension]
name = "Swift"
version = "0.1.0"
description = "Syntax highlighting for Swift."

[sources.swift]
repository = "https://github.com/alex-pinkus/tree-sitter-swift"
revision = "7b7909f2f6b9414be0958275f4c8e5d69c3bca43"
sha256 = "0be6a88d07cfa04431296e3db09a2e51938a0a5688a8010074fa5348e635e020"
licenses = [ "LICENSE" ]

[grammars.swift]
source = "swift"
path = "."
file-types = [ "swift" ]
sample = "samples/swift.txt"
injections = []

[[grammars.swift.highlights]]
path = "queries/highlights.scm"

[grammars.swift.capture-map]
spell = "_spell"
boolean = "constant.builtin.boolean"
"character.special" = "string"
