schema = 1
kind = "language"

[extension]
name = "INI"
version = "1.0.0"
description = "Syntax highlighting for INI."

[sources.ini]
repository = "https://github.com/justinmk/tree-sitter-ini"
revision = "e4018b5176132b4f3c5d6e61cea383f42288d0f5"
sha256 = "f444e80e285393763a22931b192d4f883088c0f9c20561e8a77e2149bfc66bc9"
licenses = [ "LICENSE" ]

[grammars.ini]
source = "ini"
path = "."
file-types = [ "ini", "cfg", "conf" ]
sample = "samples/ini.txt"
injections = []

[[grammars.ini.highlights]]
path = "queries/highlights.scm"

[grammars.ini.capture-map]
spell = "_spell"
