schema = 1
kind = "server"

[extension]
name = "Biome"
version = "0.1.0"
description = "The Biome language server."
license = "MIT OR Apache-2.0"

[pack]
kind = "archive"
version = "2.5.15"

[pack.upstream]
source = "github"
repository = "biomejs/biome"
tag = "@biomejs/biome@2.5.15"

[[pack.licenses]]
name = "LICENSE-MIT"
url = "https://raw.githubusercontent.com/biomejs/biome/0b4c11f553a7e702f9851af139662e1de45dc131/LICENSE-MIT"

[[pack.licenses]]
name = "LICENSE-APACHE"
url = "https://raw.githubusercontent.com/biomejs/biome/0b4c11f553a7e702f9851af139662e1de45dc131/LICENSE-APACHE"

[pack.platforms.windows-x86_64]
asset = "biome-win32-x64.exe"
format = "raw"
executables = [ "biome.exe" ]

[pack.platforms.windows-aarch64]
asset = "biome-win32-arm64.exe"
format = "raw"
executables = [ "biome.exe" ]

[pack.platforms.macos-x86_64]
asset = "biome-darwin-x64"
format = "raw"
executables = [ "biome" ]

[pack.platforms.macos-aarch64]
asset = "biome-darwin-arm64"
format = "raw"
executables = [ "biome" ]

[pack.platforms.linux-x86_64]
asset = "biome-linux-x64-musl"
format = "raw"
executables = [ "biome" ]

[pack.platforms.linux-aarch64]
asset = "biome-linux-arm64-musl"
format = "raw"
executables = [ "biome" ]

[servers.biome]
name = "Biome"
command = "${extension}/biome"
args = [ "lsp-proxy" ]

[servers.biome.root]
markers = [ "biome.json", "biome.jsonc" ]
strategy = "nearest"
fallback = "workspace"

[[servers.biome.languages]]
language = "javascript"
language_id = "javascript"

[[servers.biome.languages]]
language = "typescript"
variant = "typescript"
language_id = "typescript"

[[servers.biome.languages]]
language = "typescript"
variant = "tsx"
language_id = "typescriptreact"

[[servers.biome.languages]]
language = "json"
language_id = "json"

[[servers.biome.languages]]
language = "css"
language_id = "css"
