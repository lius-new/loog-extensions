[package]
name = "loog-remote-wsl"
version = "0.1.0"
edition = "2024"
publish = false
build = "../../../remote/build.rs"

[lib]
path = "../../../remote/client.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
loog-workspace-api = { path = "../../../.work/loog-sdk/crates/workspace-api" }

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
