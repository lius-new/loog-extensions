schema = 1
kind = "language"

[extension]
name = "HCL"
version = "1.0.0"
description = "Syntax highlighting for HCL."

[sources.hcl]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-hcl"
revision = "64ad62785d442eb4d45df3a1764962dafd5bc98b"
sha256 = "b71a0efe45b2aef5e91410d8d4ce15d107be47bc1f729752efae53c60d2d1158"
licenses = [ "LICENSE" ]

[sources.helix]
repository = "https://github.com/helix-editor/helix"
revision = "ba40e547426b0f9896c8bdc699a4ab11f2b37dbc"
sha256 = "c5e35c68897a0f3793937095d8d9c13340fa18e727a3696ae16fa0edd1d08d23"
licenses = [ "LICENSE" ]

[grammars.hcl]
source = "hcl"
path = "."
file-types = [ "hcl", "tf", "tfvars" ]
sample = "samples/hcl.txt"
injections = []

[[grammars.hcl.highlights]]
source = "helix"
path = "runtime/queries/hcl/highlights.scm"

[grammars.hcl.capture-map]
none = "_none"
