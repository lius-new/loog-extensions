schema = 1
kind = "server"

[extension]
name = "YAML Language Server"
version = "0.1.0"
description = "The YAML Language Server language server."
license = "MIT"
requires = [ "loom.runtime.node@^0.1.0" ]

[pack]
kind = "npm"
version = "2.0.0"
packages = [ "yaml-language-server@2.0.0" ]

[servers.yaml-language-server]
name = "YAML Language Server"
command = "${runtime.node}/node"
args = [ "${extension}/node_modules/yaml-language-server/bin/yaml-language-server", "--stdio" ]

[servers.yaml-language-server.root]
markers = [ ".git" ]
strategy = "nearest"
fallback = "workspace"

[[servers.yaml-language-server.languages]]
language = "yaml"
language_id = "yaml"
