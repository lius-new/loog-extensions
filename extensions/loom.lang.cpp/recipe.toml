schema = 1
kind = "language"

[extension]
name = "C++"
version = "1.0.0"
description = "Syntax highlighting for C++."

[sources.c]
repository = "https://github.com/tree-sitter/tree-sitter-c"
revision = "b780e47fc780ddc8da13afa35a3f4ed5c157823d"
sha256 = "dc3979e40fce678c27273ba8ab93b48b5acd6b91d1dfde6a4451222d366d689f"
licenses = [ "LICENSE" ]

[sources.cpp]
repository = "https://github.com/tree-sitter/tree-sitter-cpp"
revision = "8b5b49eb196bec7040441bee33b2c9a4838d6967"
sha256 = "a12b464b8c89d7c1843849bfebb0b5807980555351d60598b92939233abff842"
licenses = [ "LICENSE" ]

[grammars.cpp]
source = "cpp"
path = "."
file-types = [ "cpp", "cc", "cxx", "hpp", "hh", "hxx" ]
sample = "samples/cpp.txt"
injections = []

[[grammars.cpp.highlights]]
source = "c"
path = "queries/highlights.scm"

[[grammars.cpp.highlights]]
path = "queries/highlights.scm"

[grammars.cpp.capture-map]
delimiter = "punctuation.delimiter"
