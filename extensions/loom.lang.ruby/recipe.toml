schema = 1
kind = "language"

[extension]
name = "Ruby"
version = "1.0.0"
description = "Syntax highlighting for Ruby."

[sources.ruby]
repository = "https://github.com/tree-sitter/tree-sitter-ruby"
revision = "ad907a69da0c8a4f7a943a7fe012712208da6dee"
sha256 = "f7aa2408f1b39922f85add38cacd60b59828a8222c609a240f08779d46d079d9"
licenses = [ "LICENSE" ]

[grammars.ruby]
source = "ruby"
path = "."
file-types = [ "rb", "rake", "gemspec", "gemfile", "rakefile" ]
sample = "samples/ruby.txt"
injections = []

[[grammars.ruby.highlights]]
path = "queries/highlights.scm"
