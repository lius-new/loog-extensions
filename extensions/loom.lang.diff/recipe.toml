schema = 1
kind = "language"
patches = [ "patches/diff-highlights.patch" ]

[extension]
name = "Diff"
version = "0.1.0"
description = "Syntax highlighting for Diff."

[sources.diff]
repository = "https://github.com/the-mikedavis/tree-sitter-diff"
revision = "2520c3f934b3179bb540d23e0ef45f75304b5fed"
sha256 = "247bce0d642c114d425a0e5d54357972fc0f9c3203de7249f71637f7fd5c6d85"
licenses = [ "LICENSE" ]

[grammars.diff]
source = "diff"
path = "."
file-types = [ "diff", "patch" ]
sample = "samples/diff.txt"
injections = []

[[grammars.diff.highlights]]
path = "queries/highlights.scm"

[grammars.diff.capture-map]
spell = "_spell"
"diff.plus" = "string"
"diff.minus" = "comment"
