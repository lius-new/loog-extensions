schema = 1
kind = "language"

[extension]
name = "Kotlin"
version = "0.1.0"
description = "Syntax highlighting for Kotlin."

[sources.kotlin]
repository = "https://github.com/fwcd/tree-sitter-kotlin"
revision = "f66d2908542e93c0204c6c241f794afe4e9cd5d1"
sha256 = "d5449d701d40883d989454c3cd772d84ef90865c98e8e699e37cf535f9a1b95f"
licenses = [ "LICENSE" ]

[grammars.kotlin]
source = "kotlin"
path = "."
file-types = [ "kt", "kts" ]
sample = "samples/kotlin.txt"
injections = []

[[grammars.kotlin.highlights]]
path = "queries/highlights.scm"

[grammars.kotlin.capture-map]
namespace = "module"
include = "keyword"
parameter = "variable.parameter"
float = "number"
boolean = "constant.builtin.boolean"
character = "string"
conditional = "keyword.control.conditional"
repeat = "keyword.control.repeat"
exception = "keyword"
none = "_none"
