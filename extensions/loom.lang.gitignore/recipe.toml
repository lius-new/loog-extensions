schema = 1
kind = "language"

[extension]
name = "Git Ignore"
version = "1.0.0"
description = "Syntax highlighting for Git Ignore."

[sources.gitignore]
repository = "https://github.com/shunsambongi/tree-sitter-gitignore"
revision = "f4685bf11ac466dd278449bcfe5fd014e94aa504"
sha256 = "15727772801cf49bd85b147dc7f77f6c3ddabbdb3b3d55c6580e7dd8f7aa559c"
licenses = [ "LICENSE" ]

[sources.loom-queries]
directory = "local/loom-queries"
licenses = [ "LICENSE" ]

[grammars.gitignore]
source = "gitignore"
path = "."
file-types = [ "gitignore", ".gitignore", ".ignore" ]
sample = "samples/gitignore.txt"
injections = []

[[grammars.gitignore.highlights]]
source = "loom-queries"
path = "gitignore.scm"
