schema = 1
kind = "language"

[extension]
name = "GraphQL"
version = "0.1.0"
description = "Syntax highlighting for GraphQL."

[sources.graphql]
repository = "https://github.com/bkegley/tree-sitter-graphql"
revision = "5e66e961eee421786bdda8495ed1db045e06b5fe"
sha256 = "ff542fddb51b1f1c110bb36fa16703d2212eeae0c0d12a2e1bf813c5f5db9507"
licenses = [ "LICENSE" ]

[sources.helix]
repository = "https://github.com/helix-editor/helix"
revision = "ba40e547426b0f9896c8bdc699a4ab11f2b37dbc"
sha256 = "c5e35c68897a0f3793937095d8d9c13340fa18e727a3696ae16fa0edd1d08d23"
licenses = [ "LICENSE" ]

[grammars.graphql]
source = "graphql"
path = "."
file-types = [ "graphql", "gql" ]
sample = "samples/graphql.txt"
injections = []

[[grammars.graphql.highlights]]
source = "helix"
path = "runtime/queries/graphql/highlights.scm"
