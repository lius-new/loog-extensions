schema = 1
kind = "language"

[extension]
name = "Git Commit"
version = "1.0.0"
description = "Syntax highlighting for Git Commit."

[sources.gitcommit]
repository = "https://github.com/gbprod/tree-sitter-gitcommit"
revision = "49715a9e6f19ce3d33b875aacdd6ad8ddaee0ffe"
sha256 = "2ecf6fd8eb935e9ed9f4e3bf5c321d31ff25f37441eaa02bb4d895f7ace80724"
licenses = [ "LICENCE" ]

[sources.wasi-support]
directory = "local/wasi-support"
licenses = [ "COPYRIGHT", "SOURCE.md" ]

[grammars.gitcommit]
source = "gitcommit"
path = "."
file-types = [ "commit_editmsg", "merge_msg", "tag_editmsg" ]
sample = "samples/gitcommit.txt"
injections = []
optimize = false

[[grammars.gitcommit.highlights]]
path = "queries/highlights.scm"

[grammars.gitcommit.capture-map]
"markup.heading" = "string"
"markup.link" = "string"
spell = "_spell"
nospell = "_nospell"
none = "_none"

[[grammars.gitcommit.support]]
source = "wasi-support"
path = "iswcntrl.c"
