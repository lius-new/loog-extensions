schema = 1
kind = "server"

[extension]
name = "Pyright"
version = "0.1.0"
description = "The Pyright language server."
license = "MIT"
requires = [ "loom.runtime.node@^0.1.0" ]

[pack]
kind = "npm"
version = "1.1.414"
packages = [ "pyright@1.1.414" ]

[servers.pyright]
name = "Pyright"
command = "${runtime.node}/node"
args = [ "${extension}/node_modules/pyright/langserver.index.js", "--stdio" ]
priority = 10

[servers.pyright.root]
markers = [ "pyrightconfig.json", "pyproject.toml", "setup.py", "setup.cfg", "requirements.txt" ]
strategy = "nearest"
fallback = "workspace"

[[servers.pyright.languages]]
language = "python"
language_id = "python"
