[package]
name = "loog-vscode-langservers-extracted-client"
build = "../../../language-clients/rust/build.rs"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "../../../language-clients/rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.57"
serde_json = "1"
globset = { version = "0.4", default-features = false }
loog-language-workspace = { path = "../../../language-clients/rust/workspace", optional = true }

[features]
default = ["environment"]
environment = ["dep:loog-language-workspace"]

[build-dependencies]
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
