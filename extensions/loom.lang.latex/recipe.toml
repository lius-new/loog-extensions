schema = 1
kind = "language"

[extension]
name = "LaTeX"
version = "0.1.0"
description = "Syntax highlighting for LaTeX."

[sources.helix]
repository = "https://github.com/helix-editor/helix"
revision = "ba40e547426b0f9896c8bdc699a4ab11f2b37dbc"
sha256 = "c5e35c68897a0f3793937095d8d9c13340fa18e727a3696ae16fa0edd1d08d23"
licenses = [ "LICENSE" ]

[sources.latex]
repository = "https://github.com/latex-lsp/tree-sitter-latex"
revision = "8c75e93cd08ccb7ce1ccab22c1fbd6360e3bcea6"
sha256 = "5c4606f958fa5668e30fffd139650640ffe1ad25841de951e6cd2cdad3a99030"
licenses = [ "LICENSE" ]

[grammars.latex]
source = "latex"
path = "."
file-types = [ "tex", "sty", "cls" ]
sample = "samples/latex.txt"
injections = []

[[grammars.latex.highlights]]
source = "helix"
path = "runtime/queries/latex/highlights.scm"

[grammars.latex.capture-map]
"markup.link.label" = "string"
"markup.raw.block" = "string"
"markup.raw.inline" = "string"
"markup.raw" = "string"
namespace = "module"
"markup.heading" = "string"
"markup.italic" = "string"
"markup.bold" = "string"
"markup.link.url" = "string"
