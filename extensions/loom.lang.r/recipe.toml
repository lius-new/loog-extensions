schema = 1
kind = "language"

[extension]
name = "R"
version = "0.1.0"
description = "Syntax highlighting for R."

[sources.r]
repository = "https://github.com/r-lib/tree-sitter-r"
revision = "0e6ef7741712c09dc3ee6e81c42e919820cc65ef"
sha256 = "5774cd2ae3782bad1dd61fbd3e82f494e02e6cac556485f36f59bfd99f3e2528"
licenses = [ "LICENSE" ]

[grammars.r]
source = "r"
path = "."
file-types = [ "r", "rprofile" ]
sample = "samples/r.txt"
injections = []

[[grammars.r.highlights]]
path = "queries/highlights.scm"

[grammars.r.capture-map]
namespace = "module"
conditional = "keyword.control.conditional"
repeat = "keyword.control.repeat"
boolean = "constant.builtin.boolean"
error = "_error"
