schema = 1
kind = "server"

[extension]
name = "Bash Language Server"
version = "0.1.0"
description = "The Bash Language Server language server."
license = "MIT"
requires = [ "loom.runtime.node@^0.1.0" ]

[pack]
kind = "npm"
version = "5.8.1"
packages = [ "bash-language-server@5.8.1" ]

[servers.bash-language-server]
name = "Bash Language Server"
command = "${runtime.node}/node"
args = [ "${extension}/node_modules/bash-language-server/out/cli.js", "start" ]

[servers.bash-language-server.root]
markers = [ ".git" ]
strategy = "nearest"
fallback = "workspace"

[[servers.bash-language-server.languages]]
language = "bash"
language_id = "shellscript"
