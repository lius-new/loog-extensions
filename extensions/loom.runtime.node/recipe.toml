schema = 1
kind = "runtime"

[extension]
name = "Node.js"
version = "0.1.0"
description = "The Node.js runtime that JavaScript language servers run on."
license = "MIT"

[pack]
kind = "archive"
version = "22.23.3"

[pack.upstream]
source = "nodejs"

[pack.platforms.windows-x86_64]
asset = "node-v22.23.3-win-x64.zip"
format = "zip"
executables = [ "node.exe" ]
include = [ "node.exe", "LICENSE" ]

[pack.platforms.windows-aarch64]
asset = "node-v22.23.3-win-arm64.zip"
format = "zip"
executables = [ "node.exe" ]
include = [ "node.exe", "LICENSE" ]

[pack.platforms.macos-x86_64]
asset = "node-v22.23.3-darwin-x64.tar.gz"
format = "tar.gz"
executables = [ "node" ]
include = [ { from = "bin/node", to = "node" }, "LICENSE" ]

[pack.platforms.macos-aarch64]
asset = "node-v22.23.3-darwin-arm64.tar.gz"
format = "tar.gz"
executables = [ "node" ]
include = [ { from = "bin/node", to = "node" }, "LICENSE" ]

[pack.platforms.linux-x86_64]
asset = "node-v22.23.3-linux-x64.tar.xz"
format = "tar.xz"
executables = [ "node" ]
include = [ { from = "bin/node", to = "node" }, "LICENSE" ]

[pack.platforms.linux-aarch64]
asset = "node-v22.23.3-linux-arm64.tar.xz"
format = "tar.xz"
executables = [ "node" ]
include = [ { from = "bin/node", to = "node" }, "LICENSE" ]
