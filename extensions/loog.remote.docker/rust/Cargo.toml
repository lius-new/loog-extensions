[package]
name = "loog-remote-docker"
version = "0.1.0"
edition = "2024"
publish = false
build = "../../../remote/build.rs"

[lib]
path = "../../../remote/client.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
sha2 = "0.10"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
loog-workspace-api = { path = "../../../.work/loog-sdk/crates/workspace-api" }

[build-dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
