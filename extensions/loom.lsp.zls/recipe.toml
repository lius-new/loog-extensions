schema = 1
kind = "server"

[extension]
name = "zls"
version = "0.17.0"
description = "The zls language server."
license = "MIT"

[pack]
kind = "archive"
version = "0.17.0"

[pack.upstream]
source = "github"
repository = "zigtools/zls"
tag = "0.17.0"

[[pack.licenses]]
name = "LICENSE"
url = "https://raw.githubusercontent.com/zigtools/zls/0.17.0/LICENSE"

[pack.platforms.windows-x86_64]
asset = "zls-x86_64-windows.zip"
format = "zip"
executables = [ "zls.exe" ]

[pack.platforms.windows-aarch64]
asset = "zls-aarch64-windows.zip"
format = "zip"
executables = [ "zls.exe" ]

[pack.platforms.macos-x86_64]
asset = "zls-x86_64-macos.tar.xz"
format = "tar.xz"
executables = [ "zls" ]

[pack.platforms.macos-aarch64]
asset = "zls-aarch64-macos.tar.xz"
format = "tar.xz"
executables = [ "zls" ]

[pack.platforms.linux-x86_64]
asset = "zls-x86_64-linux.tar.xz"
format = "tar.xz"
executables = [ "zls" ]

[pack.platforms.linux-aarch64]
asset = "zls-aarch64-linux.tar.xz"
format = "tar.xz"
executables = [ "zls" ]

[servers.zls]
name = "zls"
command = "${extension}/zls"

[servers.zls.root]
markers = [ "build.zig", "build.zig.zon" ]
strategy = "nearest"
fallback = "file_directory"

[[servers.zls.languages]]
language = "zig"
language_id = "zig"
