schema = 1
kind = "language"

[extension]
name = "C"
version = "0.1.0"
description = "Syntax highlighting for C."

[sources.c]
repository = "https://github.com/tree-sitter/tree-sitter-c"
revision = "b780e47fc780ddc8da13afa35a3f4ed5c157823d"
sha256 = "dc3979e40fce678c27273ba8ab93b48b5acd6b91d1dfde6a4451222d366d689f"
licenses = [ "LICENSE" ]

[grammars.c]
source = "c"
path = "."
file-types = [ "c", "h" ]
sample = "samples/c.txt"
injections = []

[[grammars.c.highlights]]
path = "queries/highlights.scm"

[grammars.c.capture-map]
delimiter = "punctuation.delimiter"
