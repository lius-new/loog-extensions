schema = 1
kind = "language"

[extension]
name = "CMake"
version = "1.0.0"
description = "Syntax highlighting for CMake."

[sources.cmake]
repository = "https://github.com/uyha/tree-sitter-cmake"
revision = "c7b2a71e7f8ecb167fad4c97227c838439280175"
sha256 = "f68f4c860d06e12f6fd1c23a0473f7813c2de0c1e8293dbbefa26bafd1a9cae2"
licenses = [ "LICENSE" ]

[sources.helix]
repository = "https://github.com/helix-editor/helix"
revision = "ba40e547426b0f9896c8bdc699a4ab11f2b37dbc"
sha256 = "c5e35c68897a0f3793937095d8d9c13340fa18e727a3696ae16fa0edd1d08d23"
licenses = [ "LICENSE" ]

[grammars.cmake]
source = "cmake"
path = "."
file-types = [ "cmakelists.txt", "cmake" ]
sample = "samples/cmake.txt"
injections = []

[[grammars.cmake.highlights]]
source = "helix"
path = "runtime/queries/cmake/highlights.scm"

[grammars.cmake.capture-map]
none = "_none"
spell = "_spell"
boolean = "constant.builtin.boolean"
nospell = "_nospell"
