schema = 1
kind = "language"

[extension]
name = "Nix"
version = "1.0.0"
description = "Syntax highlighting for Nix."

[sources.nix]
repository = "https://github.com/numtide/tree-sitter-nix"
revision = "70f34e95e30b7ebcc40815d4385d68576c4a15cd"
sha256 = "e3de0d2095ddb28ba5929f2be8d7d76733412483ce93bdd14da908fa29ed95fe"
licenses = [ "LICENSE" ]

[grammars.nix]
source = "nix"
path = "."
file-types = [ "nix" ]
sample = "samples/nix.txt"
injections = []

[[grammars.nix.highlights]]
path = "queries/highlights.scm"

[grammars.nix.capture-map]
spell = "_spell"
boolean = "constant.builtin.boolean"
