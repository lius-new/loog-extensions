schema = 1
kind = "server"

[extension]
name = "Lua Language Server"
version = "3.19.2"
description = "The Lua Language Server language server."
license = "MIT"

[pack]
kind = "archive"
version = "3.19.2"

[pack.upstream]
source = "github"
repository = "LuaLS/lua-language-server"
tag = "3.19.2"

[[pack.licenses]]
name = "LICENSE"
url = "https://raw.githubusercontent.com/LuaLS/lua-language-server/3.19.2/LICENSE"

[pack.platforms.windows-x86_64]
asset = "lua-language-server-3.19.2-win32-x64.zip"
format = "zip"
executables = [ "bin/lua-language-server.exe" ]

[pack.platforms.macos-x86_64]
asset = "lua-language-server-3.19.2-darwin-x64.tar.gz"
format = "tar.gz"
executables = [ "bin/lua-language-server" ]

[pack.platforms.macos-aarch64]
asset = "lua-language-server-3.19.2-darwin-arm64.tar.gz"
format = "tar.gz"
executables = [ "bin/lua-language-server" ]

[pack.platforms.linux-x86_64]
asset = "lua-language-server-3.19.2-linux-x64.tar.gz"
format = "tar.gz"
executables = [ "bin/lua-language-server" ]

[pack.platforms.linux-aarch64]
asset = "lua-language-server-3.19.2-linux-arm64.tar.gz"
format = "tar.gz"
executables = [ "bin/lua-language-server" ]

[servers.lua-language-server]
name = "Lua Language Server"
command = "${extension}/bin/lua-language-server"

[servers.lua-language-server.root]
markers = [ ".luarc.json", ".luarc.jsonc" ]
strategy = "nearest"
fallback = "workspace"

[[servers.lua-language-server.languages]]
language = "lua"
language_id = "lua"
