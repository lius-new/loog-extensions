schema = 1
kind = "language"

[extension]
name = "Scala"
version = "0.1.0"
description = "Syntax highlighting for Scala."

[sources.scala]
repository = "https://github.com/tree-sitter/tree-sitter-scala"
revision = "4d081d98670ff6e98ca42c085294fc75eec15e1d"
sha256 = "5988ed265fc3a606220d93e1ccc2da932bdb5d8ba4abd436e3c8b4b21a6d4191"
licenses = [ "LICENSE" ]

[grammars.scala]
source = "scala"
path = "."
file-types = [ "scala", "sc" ]
sample = "samples/scala.txt"
injections = []

[[grammars.scala.highlights]]
path = "queries/highlights.scm"

[grammars.scala.capture-map]
parameter = "variable.parameter"
none = "_none"
namespace = "module"
"method.call" = "function.method"
method = "function.method"
boolean = "constant.builtin.boolean"
float = "number"
storageclass = "keyword.storage"
conditional = "keyword.control.conditional"
repeat = "keyword.control.repeat"
include = "keyword"
exception = "keyword"
spell = "_spell"
