[package]
name = "loom-native-language-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
wit-bindgen = "0.57"
serde_json = "1"
globset = { version = "0.4", default-features = false }

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
