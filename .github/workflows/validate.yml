name: Validate

# The tools and their tests. extensions.yml builds the affected extensions in a
# parallel matrix on pushes and pull requests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Test offline tool preparation
        run: python3 -m unittest discover -s language-clients/rust -p 'environment_tools_test.py'
