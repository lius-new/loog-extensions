name: Publish

# Takes in this workflow run's completed build batch and publishes it: every
# package must be one Loog can import, a released version never changes, and the
# signed index is updated by exactly one writer at a time. Only this workflow holds
# the index signing key; the extensions' build jobs never see it.
on:
  workflow_call:
    secrets:
      LOOG_INDEX_KEY:
        required: true

permissions:
  contents: read

jobs:
  aot-corpus:
    name: Build cross-platform AOT interoperability corpus
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.corpus.outputs.artifact-id }}
      count: ${{ steps.emit.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: .work/handed-over
      - name: Select official component inputs
        id: plan
        run: node scripts/aot-contract.mjs plan .work/handed-over/*
      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.has-clients == 'true'
        with:
          toolchain: 1.98.0
      - uses: actions/cache@v4
        if: steps.plan.outputs.has-clients == 'true'
        with:
          path: tools/aot-compiler/target
          key: aot-${{ runner.os }}-rust-1.98.0-${{ hashFiles('tools/aot-compiler/Cargo.lock', 'tools/aot-compiler/Cargo.toml', 'tools/aot-compiler/src/**') }}
      - name: Compile trusted publisher tool
        if: steps.plan.outputs.has-clients == 'true'
        run: cargo build --release --locked --manifest-path tools/aot-compiler/Cargo.toml
      - name: Generate signed conformance corpus
        id: emit
        run: node scripts/aot-contract.mjs emit .work/aot-corpus .work/handed-over/*
      - uses: actions/upload-artifact@v4
        id: corpus
        with:
          name: aot-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/aot-corpus
          retention-days: 3
          if-no-files-found: error

  aot-native:
    name: Verify AOT on ${{ matrix.target }}
    needs: aot-corpus
    if: needs.aot-corpus.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned Loog source
        id: loog
        shell: bash
        run: |
          echo "repository=$(sed -n 's/^repository = "\(.*\)"$/\1/p' tools/loog-source.toml)" >> "$GITHUB_OUTPUT"
          echo "revision=$(sed -n 's/^revision = "\(.*\)"$/\1/p' tools/loog-source.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.loog.outputs.repository }}
          ref: ${{ steps.loog.outputs.revision }}
          path: .work/loog-sdk
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: .work/loog-sdk/target
          key: aot-host-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-${{ hashFiles('.work/loog-sdk/Cargo.lock', '.work/loog-sdk/crates/extension-host/**', '.work/loog-sdk/wit/**') }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.aot-corpus.outputs.artifact-id }}
          path: .work/aot-corpus
          merge-multiple: true
      - name: Require direct AOT loading and instantiate the real component ABI
        run: cargo run --release --locked --manifest-path .work/loog-sdk/Cargo.toml -p loog-extension-host --target ${{ matrix.target }} --example aot_verify -- .work/aot-corpus ${{ matrix.target }}


  publish:
    needs: [aot-corpus, aot-native]
    if: >-
      ${{ !cancelled() && needs.aot-corpus.result == 'success' && (needs.aot-native.result == 'success' || (needs.aot-native.result == 'skipped' && needs.aot-corpus.outputs.count == '0')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    concurrency:
      group: extension-publication
      cancel-in-progress: false
      # Keep complete commit batches waiting; never replace a pending publisher.
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download this run's completed build packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: .work/handed-over
      - name: Require at least one completed package
        shell: bash
        run: find .work/handed-over -name '*.loogext' -print -quit | grep -q .
      - name: Check the publication signing key
        env:
          LOOG_INDEX_KEY: ${{ secrets.LOOG_INDEX_KEY }}
        run: node scripts/loog-ext.mjs release preflight
      - name: Find the pinned production validator
        id: validator
        run: node scripts/validator-source.mjs
      - name: Check out the pinned validator source when no binary is published
        if: steps.validator.outputs.source == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.validator.outputs.repository }}
          ref: ${{ steps.validator.outputs.revision }}
          path: .work/validator-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: steps.validator.outputs.source == 'true'
        with:
          toolchain: 1.97.1
      - name: Cache the pinned validator build
        if: steps.validator.outputs.source == 'true'
        uses: actions/cache@v4
        with:
          path: .work/validator-source/tools/ext-validate/target
          key: validator-${{ runner.os }}-${{ hashFiles('tools/loog-source.toml', 'tools/validator.lock') }}
      - name: Build the production validator
        if: steps.validator.outputs.source == 'true'
        run: |
          cargo build --release --locked --manifest-path .work/validator-source/tools/ext-validate/Cargo.toml --bin loog-ext-validate
          mkdir -p tools/bin
          cp .work/validator-source/tools/ext-validate/target/release/loog-ext-validate tools/bin/loog-ext-validate
      - name: Install the pinned AOT compiler toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Cache the trusted AOT compiler
        uses: actions/cache@v4
        with:
          path: tools/aot-compiler/target
          key: aot-${{ runner.os }}-rust-1.98.0-${{ hashFiles('tools/aot-compiler/Cargo.lock', 'tools/aot-compiler/Cargo.toml', 'tools/aot-compiler/src/**') }}
      - name: Build the trusted cross-platform AOT compiler
        run: cargo build --release --locked --manifest-path tools/aot-compiler/Cargo.toml
      - name: Compile and authenticate official language-client AOT
        env:
          LOOG_INDEX_KEY: ${{ secrets.LOOG_INDEX_KEY }}
        run: node scripts/prepare-aot.mjs .work/handed-over/* --out .work/aot-packages
      - name: Take in the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/loog-ext.mjs release intake .work/aot-packages
      - name: Publish the releases and update the signed index
        env:
          GH_TOKEN: ${{ github.token }}
          LOOG_INDEX_KEY: ${{ secrets.LOOG_INDEX_KEY }}
        run: node scripts/loog-ext.mjs release publish
      - name: Keep the delivery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/aot-packages/aot-provenance.json
            .work/release
            dist/packages
            dist/index
            dist/lock
          if-no-files-found: warn
