name: Release

# Explicit extension versions merged to main are delivered automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: Only show pending versions (do not build or publish)
        type: boolean
        default: true
      reset:
        description: Reset the index and DELETE all extension releases and tags before publishing
        type: boolean
        default: false

permissions:
  contents: read

# One writer owns extension releases and the signed registry. Every run scans all
# current pending versions, so a later push also picks up an interrupted batch.
concurrency:
  group: extension-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/loom-ext.mjs check
      - name: Reset early-stage extension releases and the signed registry
        if: github.event_name == 'workflow_dispatch' && inputs.reset && !inputs.preview
        env:
          GH_TOKEN: ${{ github.token }}
          LOOM_INDEX_KEY: ${{ secrets.LOOM_INDEX_KEY }}
        run: node scripts/reset-registry.mjs --confirm
      - name: Plan pending versions and enforce explicit version changes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/loom-ext.mjs release plan
      - name: Check the publication signing key before building
        if: (steps.plan.outputs.count != '0' || steps.plan.outputs.repair == 'true') && (github.event_name == 'push' || !inputs.preview)
        env:
          LOOM_INDEX_KEY: ${{ secrets.LOOM_INDEX_KEY }}
        run: node scripts/loom-ext.mjs release preflight
      - name: Find the pinned production validator
        id: validator
        if: steps.plan.outputs.count != '0' && (github.event_name == 'push' || !inputs.preview)
        run: node scripts/validator-source.mjs
      - name: Check out the pinned validator source when no binary is published
        if: steps.validator.outputs.source == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.validator.outputs.repository }}
          ref: ${{ steps.validator.outputs.revision }}
          path: .work/validator-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: steps.validator.outputs.source == 'true'
        with:
          toolchain: 1.97.1
      - name: Cache the pinned validator build
        if: steps.validator.outputs.source == 'true'
        uses: actions/cache@v4
        with:
          path: .work/validator-source/tools/ext-validate/target
          key: validator-${{ runner.os }}-${{ hashFiles('tools/validator-source.toml', 'tools/validator.lock') }}
      - name: Build the production validator
        if: steps.validator.outputs.source == 'true'
        run: |
          cargo build --release --locked --manifest-path .work/validator-source/tools/ext-validate/Cargo.toml --bin loom-ext-validate
          mkdir -p tools/bin
          cp .work/validator-source/tools/ext-validate/target/release/loom-ext-validate tools/bin/loom-ext-validate
      - name: Cache verified grammar build inputs
        if: steps.plan.outputs.count != '0' && (github.event_name == 'push' || !inputs.preview)
        uses: actions/cache@v4
        with:
          path: |
            .work/tools
            .work/downloads
            .work/modules
          key: extension-inputs-${{ runner.os }}-${{ hashFiles('tools/toolchain.toml', 'extensions/**/recipe.toml', 'extensions/**/pins.toml') }}
          restore-keys: extension-inputs-${{ runner.os }}-
      - name: Build, validate and pack each pending extension
        if: (steps.plan.outputs.count != '0' || steps.plan.outputs.repair == 'true') && (github.event_name == 'push' || !inputs.preview)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/loom-ext.mjs release prepare
      - name: Publish verified releases and update the signed index
        if: (steps.plan.outputs.count != '0' || steps.plan.outputs.repair == 'true') && (github.event_name == 'push' || !inputs.preview)
        env:
          GH_TOKEN: ${{ github.token }}
          LOOM_INDEX_KEY: ${{ secrets.LOOM_INDEX_KEY }}
        run: node scripts/loom-ext.mjs release publish
      - name: Keep delivery results and recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-delivery-${{ github.run_id }}
          path: |
            .work/release
            dist/packages
            dist/index
            dist/lock
          if-no-files-found: warn
