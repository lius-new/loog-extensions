name: Extensions

# One build batch per event, followed by one publication of this run's packages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extensions:
        description: Comma-separated extension IDs (empty builds all extensions)
        type: string
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-extensions: ${{ steps.select.outputs.has-extensions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select affected extensions
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Write affected extension matrix
        id: select
        env:
          REQUESTED_EXTENSIONS: ${{ inputs.extensions }}
        run: node scripts/ci/select-extensions.mjs

  build:
    needs: plan
    if: needs.plan.outputs.has-extensions == 'true'
    name: Build ${{ matrix.extension }}
    runs-on: ubuntu-latest
    env:
      LOOG_SOURCE: ${{ github.workspace }}/.work/loog-sdk
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the pinned Loog source for Rust components
        id: loog
        env:
          LOOG_EXTENSION: ${{ matrix.extension }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [[ ! -f "extensions/$LOOG_EXTENSION/rust/Cargo.toml" ]]; then exit 0; fi
          echo "repository=$(sed -n 's/^repository = "\(.*\)"$/\1/p' tools/loog-source.toml)" >> "$GITHUB_OUTPUT"
          echo "revision=$(sed -n 's/^revision = "\(.*\)"$/\1/p' tools/loog-source.toml)" >> "$GITHUB_OUTPUT"
      - name: Check out the general Loog SDK
        if: steps.loog.outputs.revision != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.loog.outputs.repository }}
          ref: ${{ steps.loog.outputs.revision }}
          path: .work/loog-sdk
          persist-credentials: false
      - name: Install the Rust component toolchain
        if: steps.loog.outputs.revision != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Test the private Rust component
        if: steps.loog.outputs.revision != ''
        run: cargo test --manifest-path rust/Cargo.toml --locked --lib
      - uses: actions/setup-go@v5
        if: matrix.extension == 'loog.lsp.gopls'
        with:
          go-version: stable
      - run: npm ci
      - run: node build.mjs
      - name: Test the Linux agent
        if: matrix.extension == 'loog.remote.ssh'
        working-directory: ${{ github.workspace }}
        run: cargo test --locked --manifest-path remote/agent/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.extension }}
          path: extensions/${{ matrix.extension }}/dist/*.loogext
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [plan, build]
    # PRs run the same AOT interoperability checks without publication credentials.
    # Main may publish successful builds after the complete matrix finishes.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.has-extensions == 'true' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    secrets:
      LOOG_INDEX_KEY: ${{ secrets.LOOG_INDEX_KEY }}
      LOOG_WEBSITE_DEPLOY_HOOK: ${{ secrets.LOOG_WEBSITE_DEPLOY_HOOK }}
